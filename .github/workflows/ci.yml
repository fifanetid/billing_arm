name: Node.js checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - name: Run SQLite migration and admin seed
        env:
          NODE_ENV: test
          DATABASE_PATH: ./data/ci.sqlite
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: CI-Test-Only-Password-2026
        run: |
          npm run db:migrate
          npm run seed:admin
